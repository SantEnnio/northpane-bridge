name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  STATIC_SDK_URL: https://download.swift.org/swift-6.3.2-release/static-sdk/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz
  STATIC_SDK_CHECKSUM: 3fd798bef6f4408f1ea5a6f94ce4d4052830c4326ab85ebc04f983f01b3da407

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: brew install protobuf
      - name: Generated protocol source matches the schema
        run: Scripts/check-protobuf.sh
      - name: Test
        run: swift test
      - name: Bridge self-check
        run: swift run northpane-bridge self-check --json

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.3.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build products and tests
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
      - name: Bridge self-check
        run: .build/debug/northpane-bridge self-check --json

  linux-static:
    runs-on: ubuntu-24.04
    container: swift:6.3.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install the Static Linux SDK
        run: swift sdk install "$STATIC_SDK_URL" --checksum "$STATIC_SDK_CHECKSUM"
      - name: Static Bridge, x86_64
        run: Scripts/build-static-linux.sh x86_64 artifacts
      - name: Static Bridge, arm64
        run: Scripts/build-static-linux.sh aarch64 artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: northpane-bridge-linux
          path: artifacts/

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6 # v0.4.1
        with:
          swift-version: swift-6.3.2-release
          swift-build: 6.3.2-RELEASE
      - uses: actions/cache@v4
        with:
          path: .build
          key: windows-build-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: windows-build-${{ hashFiles('Package.resolved') }}-
      - name: Build products and tests
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
      - name: Bridge self-check
        run: .build\debug\northpane-bridge.exe self-check --json
      - name: Package the Windows Bridge with its DLLs
        shell: pwsh
        run: Scripts/package-windows.ps1 -OutputDirectory artifacts
      - name: install.ps1 installs the package for the current user
        shell: pwsh
        run: |
          $zip = Resolve-Path artifacts/northpane-bridge-windows-x86_64.zip
          $digest = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "localappdata"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null

          Copy-Item $zip (Join-Path $env:RUNNER_TEMP "wrong.zip")
          pwsh -NoProfile -File ./install.ps1 -Version 0.0.1 -Sha256 ("0" * 64) -File (Join-Path $env:RUNNER_TEMP "wrong.zip")
          if ($LASTEXITCODE -ne 22) { throw "a wrong digest must exit 22, got $LASTEXITCODE" }

          foreach ($version in "0.0.1", "0.0.2", "0.0.3") {
            $copy = Join-Path $env:RUNNER_TEMP "bridge-$version.zip"
            Copy-Item $zip $copy
            pwsh -NoProfile -File ./install.ps1 -Version $version -Sha256 $digest -File $copy
            if ($LASTEXITCODE -ne 0) { throw "install $version failed with $LASTEXITCODE" }
          }
          $root = Join-Path $env:LOCALAPPDATA "Northpane\Bridge"
          $kept = (Get-ChildItem -Directory (Join-Path $root "versions")).Name | Sort-Object
          if (($kept -join ",") -ne "0.0.2,0.0.3") { throw "expected versions 0.0.2 and 0.0.3 to be kept, found $($kept -join ',')" }
          if ((Get-Content -Raw (Join-Path $root "current-version.txt")).Trim() -ne "0.0.3") { throw "current is not 0.0.3" }
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          & (Join-Path $root "current\northpane-bridge.exe") self-check --json
          if ($LASTEXITCODE -ne 0) { throw "the installed Bridge does not start through the junction" }
      - uses: actions/upload-artifact@v4
        with:
          name: northpane-bridge-windows
          path: artifacts/
